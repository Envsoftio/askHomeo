name: askhomeo-prod

x-hardening: &hardening
  network_mode: host
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend: &backend
  <<: *hardening
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    target: production
  user: "10001:10001"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777
  volumes:
    - assets:/app/data/runtime/assets
    - ./data/starter-corpus:/app/data/starter-corpus:ro
  environment: &backend-env
    DATABASE_URL: postgres://homeopath:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@127.0.0.1:${POSTGRES_PORT:-5437}/homeopath?sslmode=disable
    AI_PROVIDER: ${AI_PROVIDER:-deepinfra}
    AI_BASE_URL: ${AI_BASE_URL:-https://api.deepinfra.com/v1/openai}
    DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:?Set DEEPINFRA_API_KEY in .env.prod}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    EMBEDDING_REVISION: ${EMBEDDING_REVISION:-deepinfra-bge-m3-unpinned}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-oss-120b}
    CHAT_REVISION: ${CHAT_REVISION:-deepinfra-gpt-oss-120b-unpinned}

services:
  db:
    <<: *hardening
    image: pgvector/pgvector:pg17-bookworm
    user: "999:999"
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-p", "${POSTGRES_PORT:-5437}"]
    environment:
      POSTGRES_DB: homeopath
      POSTGRES_USER: homeopath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "${POSTGRES_PORT:-5437}", "-U", "homeopath", "-d", "homeopath"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    <<: *backend
    environment:
      <<: *backend-env
      API_ADDR: 127.0.0.1:${API_PORT:-8082}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env.prod}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      REVIEWER_NAME: ${REVIEWER_NAME:-Reviewer}
      AUTH_PRINCIPALS_JSON: ${AUTH_PRINCIPALS_JSON:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:${API_PORT:-8082}/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *backend
    command: ["/app/server", "-mode", "worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
    user: "101:101"
    environment:
      FRONTEND_BIND_ADDR: ${FRONTEND_BIND_ADDR:-127.0.0.1}
      FRONTEND_PORT: ${FRONTEND_PORT:-8088}
      API_PORT: ${API_PORT:-8082}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=101,gid=101,mode=0700
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${FRONTEND_PORT:-8088}/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  assets:
