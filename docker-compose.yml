services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: homeopath
      POSTGRES_USER: homeopath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeopath"]
      interval: 3s
      retries: 20
  adminer:
    image: adminer:4
    profiles: ["dev"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PDF_STORAGE_PROVIDER: ${PDF_STORAGE_PROVIDER:-b2}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      DATABASE_URL: postgres://homeopath:${POSTGRES_PASSWORD:-localdev}@db:5432/homeopath?sslmode=disable
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      API_TOKEN: ${API_TOKEN:-}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:-}
      ADMIN_NAME: ${ADMIN_NAME:-Local administrator}
      REVIEWER_NAME: ${REVIEWER_NAME:-Local reviewer}
      AUTH_PRINCIPALS_JSON: ${AUTH_PRINCIPALS_JSON:-}
      AI_PROVIDER: ${AI_PROVIDER:-deepinfra}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_INPUT_STYLE: ${EMBEDDING_INPUT_STYLE:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-}
      CHAT_PROMPT_SUFFIX: ${CHAT_PROMPT_SUFFIX:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-nomic-ai/nomic-embed-text-v1.5-GGUF/nomic-embed-text-v1.5.Q4_K_M.gguf}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHAT_MODEL: ${CHAT_MODEL:-qwen/qwen3-14b}
      CHAT_REVISION: ${CHAT_REVISION:-}
    volumes:
      - ./data/starter-corpus:/app/data/starter-corpus:ro
      - ./data/runtime/assets:/app/data/runtime/assets
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["/app/server", "-mode", "worker"]
    environment:
      PDF_STORAGE_PROVIDER: ${PDF_STORAGE_PROVIDER:-b2}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      DATABASE_URL: postgres://homeopath:${POSTGRES_PASSWORD:-localdev}@db:5432/homeopath?sslmode=disable
      AI_PROVIDER: ${AI_PROVIDER:-deepinfra}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_INPUT_STYLE: ${EMBEDDING_INPUT_STYLE:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-}
      CHAT_PROMPT_SUFFIX: ${CHAT_PROMPT_SUFFIX:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-nomic-ai/nomic-embed-text-v1.5-GGUF/nomic-embed-text-v1.5.Q4_K_M.gguf}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHAT_MODEL: ${CHAT_MODEL:-qwen/qwen3-14b}
      CHAT_REVISION: ${CHAT_REVISION:-}
    volumes:
      - ./data/starter-corpus:/app/data/starter-corpus:ro
      - ./data/runtime/assets:/app/data/runtime/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata:
